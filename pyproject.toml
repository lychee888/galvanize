[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galvanize"
version = "0.2.6"
description = "Event-driven activation points for AI agents: wake a fresh Hermes (or any CLI agent) session when something happens."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jarvis Lai" }]
keywords = ["agents", "webhooks", "triggers", "hermes", "automation", "events"]
dependencies = [
    "PyYAML>=6.0,<7",
    "watchdog>=4.0,<7",
    "imap-tools>=1.10,<2",
    "keyring>=24,<26",
    # himalaya bootstrap parses TOML: tomllib is 3.11+ stdlib, 3.10 needs the
    # identical-API backport (FIX-CI A: metadata and CI matrix agree on 3.10).
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.4", "py-spy>=0.3.8"]
# Declared for the C4 app-owned runtime provisioning command
# (`pip install galvanize[imap]`); the imap/keyring deps are core since
# 0.2, so the extra is an intent marker + forward compatibility.
imap = ["imap-tools>=1.10,<2", "keyring>=24,<26"]

[project.urls]
Homepage = "https://github.com/lychee888/galvanize"

[project.scripts]
galvanize = "galvanize.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"plugins/hermes" = "galvanize/_plugins/galvanize"

[tool.pytest.ini_options]
testpaths = ["tests"]
# FIX-CI C: a hang must name itself, not eat the job timeout (macOS 3.13
# burned 6 h of a cancelled run with zero output under -q).
timeout = 90
